interface:
  display_name: "全画面スライド解説動画"
  short_description: "Marp＋VOICEVOX＋ffmpeg／Remotion で全画面解説動画を設計。monologue／dialogue 対応。"
  default_prompt: "$slide-narration-video を使い、japanese-technical-writing と cognitive-rhythm-writing に依存したうえで、全画面スライド解説動画を進めてください。理解確認・誤解訂正が中心なら narration_mode: dialogue（解説役＋聞き手）、短い告知・手順なら monologue を選び、キューシートを SoT にしてください。"
